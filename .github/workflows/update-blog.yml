name: Update Blog

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the new blog posts
  actions: write # dispatch publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup GIT
        run: |
          git config --global user.name "joaosouz4dev"
          git config --global user.email "47183663+joaosouz4dev@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Setup npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup docusaurus cache
        uses: actions/cache@v6
        with:
          path: ".docusaurus"
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('**/docusaurus.config.js') }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-

      - name: Setup node_modules cache
        uses: actions/cache@v6
        with:
          path: "node_modules/.cache"
          key: ${{ runner.os }}-node_modules-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-cache-

      - name: Install Dependencies
        run: npm ci

      - name: Update Blog
        run: node .github/actions/publish-blog-releases.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Page
        run: npm run build

      - name: Commit Blog Releases
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: Update releases for blog"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed"
          done
          echo "Failed to push blog releases after 3 attempts" >&2
          exit 1

      - name: Deploy updated blog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes with GITHUB_TOKEN don't trigger publish.yml; dispatch is exempt
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            gh workflow run publish.yml
          fi
