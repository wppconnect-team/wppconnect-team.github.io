name: update-lock

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Setup npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Refresh dependency lockfile
        run: npm update --package-lock-only

      - name: Install Dependencies
        run: npm ci

      - name: Validate dependency update
        run: |
          npm run typecheck
          npm run test:dependencies
          npm run test:dev
          npm run build

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore: Updated package-lock.json"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed"
          done
          echo "Failed to push dependency lockfile after 3 attempts" >&2
          exit 1
